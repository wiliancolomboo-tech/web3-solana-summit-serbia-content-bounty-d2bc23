[package]
name = "solana_summit_engine"
version = "0.1.0"
description = "High-Performance Zero-Copy Orderbook Engine for Solana Summit Serbia"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_summit_engine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
bytemuck = { version = "1.16.1", features = ["derive", "min_const_generics"] }
solana-program = "1.18"