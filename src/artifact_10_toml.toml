[package]
name = "summit_stream"
version = "0.1.0"
description = "High Performance Proof-of-Presence & Quadratic Hackathon Vault Engine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "summit_stream"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
bytemuck = { version = "1.14", features = ["derive"] }