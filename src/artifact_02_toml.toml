[package]
name = "svs_stream"
version = "0.1.0"
description = "Solana Velocity Settlement Engine - Anchor Zero-Copy Streaming Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "svs_stream"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
bytemuck = { version = "1.16.0", features = ["derive", "min_const_generics"] }
solana-program = "1.18"